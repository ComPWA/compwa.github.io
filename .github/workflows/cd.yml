name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@313866498eb92c341d7e6b905e09f33a5979dffb # v4.1.4
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    permissions:
      contents: write
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@313866498eb92c341d7e6b905e09f33a5979dffb # v4.1.4
