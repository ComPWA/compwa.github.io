name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@e9e39f6b4e489f783fbeb9c0a8ed5992faa1f027 # v4.1.3
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    permissions:
      contents: write
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@e9e39f6b4e489f783fbeb9c0a8ed5992faa1f027 # v4.1.3
