name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@957d1151460aea469a230150b61cc3c99d3f0a0a # v4.1.2
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    permissions:
      contents: write
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@957d1151460aea469a230150b61cc3c99d3f0a0a # v4.1.2
