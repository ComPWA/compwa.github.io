    '^https[:]//expertsystem\.readthedocs\.io/en/0\.6\.8/api/expertsystem\.amplitude\.helicity_decay\.html$ https://expertsystem.readthedocs.io/0.6.8/api/expertsystem.amplitude.helicity_decay.html',
    '^https[:]//expertsystem\.readthedocs\.io/en/0\.6\.8/api/expertsystem\.amplitude\.model\.html#expertsystem\.amplitude\.model\.AmplitudeModel$ https://expertsystem.readthedocs.io/0.6.8/api/expertsystem.amplitude.model.html#expertsystem.amplitude.model.AmplitudeModel',
