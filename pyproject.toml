[project]
name = "compwa-github-io"
description = "Source code for the ComPWA Organization pages"
requires-python = "~=3.14.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Common Partial Wave Analysis", email = "compwa-admin@ep1.rub.de" }]
maintainers = [{ email = "compwa-admin@ep1.rub.de" }]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Documentation = "https://compwa.github.io"
Issues = "https://github.com/ComPWA/compwa.github.io/issues"
Source = "https://github.com/ComPWA/compwa.github.io"

[dependency-groups]
dev = [
    "ruff",
    { include-group = "doc" },
    { include-group = "jupyter" },
    { include-group = "style" },
    { include-group = "test" },
]
doc = [
    "myst-nb",
    "sphinx",
    "sphinx-api-relink",
    "sphinx-book-theme",
    "sphinx-codeautolink[ipython]",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-hep-pdgref",
    "sphinx-pybtex-etal-style",
    "sphinx-remove-toctrees",
    "sphinx-reredirects",
    "sphinx-thebe",
    "sphinx-togglebutton",
    "sphinxcontrib-bibtex>=2.0",
    { include-group = "notebooks" },
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-myst",
    "jupyterlab-quickopen",
    "python-lsp-ruff",
    "python-lsp-server",
    { include-group = "notebooks" },
]
notebooks = [
    "black",
    "graphviz",
    "ipython",
    "numpy",
    "sympy",
]
style = [
    "attrs",
    "nbformat",
    "ty",
    { include-group = "types" },
]
test = ["jupyter"]
types = [
    "attrs",
    "sphinx-api-relink",
    { include-group = "notebooks" },
]

[build-system]
requires = [
    "setuptools>=61.2",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[tool.compwa.policy]
doc-apt-packages = "graphviz"
repo-name = "compwa.github.io"
repo-title = "ComPWA Organization"

[tool.compwa.policy.github]
github-pages = true
no-pypi = true

[tool.compwa.policy.python]
type-checker = ["ty"]

[tool.lychee]
cache = true
exclude = [
    '^http[:]//127\.0\.0\.1:8000',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//atom\.io',  # often instable
    '^https[:]//doi\.org/10\.1002/andp\.19955070504',  # 403 for onlinelibrary.wiley.com
    '^https[:]//doi\.org/10\.1103',  # 403 for journals.aps.org
    '^https[:]//doi\.org/10\.1155/2020/6674595',  # 403 hindawi.com
    '^https[:]//doi\.org/10\.5281/zenodo',  # 403 for zenodo.org
    '^https[:]//doi\.org/10\.7566/JPSCP\.26\.022002',  # 403 for journals.jps.jp
    '^https[:]//downloads\.hindawi\.com',  # 403
    '^https[:]//github\.com/organizations/ComPWA/settings/repository-defaults',  # private
    '^https[:]//github\.com/search',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//ieeexplore\.ieee\.org/document/6312940',  # 401
    '^https[:]//indico\.ific\.uv\.es/event/6803',  # SSL error
    '^https[:]//journals\.aps\.org',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//leetcode\.com',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//mybinder\.org',  # often instable
    '^https[:]//rosettacode\.org',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//stackoverflow\.com',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//www\.andiamo\.co\.uk/resources/iso-language-codes',  # 443, but works
    '^https[:]//www\.bookfinder\.com',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//www\.guru99\.com/types-of-software-testing\.html',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//www\.mathworks\.com/products/matlab\.html',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//www\.npmjs\.com/package',  # Preserved from the Sphinx linkcheck configuration
    '^https[:]//zenodo\.org',  # 403
    '^https[:]//github\.com/ComPWA/RUB-EP1-AG/\.*',  # private
    '^https[:]//github.com/orgs/ComPWA/projects/\d+',  # private
    "%7B[^/]*%7D",  # URL templates are completed at build or runtime
    "^https[:]//x-access-token/$",  # Token-authenticated Git remote placeholder
    '\$(?:NEXT_[A-Z_]+|PREVIOUS_TAG)',  # Release Drafter substitutes these placeholders at runtime
    '^https[:]//github\.com/ComPWA/ampform/issues/new/choose$',  # Requires authentication
    '^https[:]//github\.com/ComPWA/compwa\.github\.io/edit/main/docs/develop\.md$',  # Requires authentication
    '^https[:]//realpython\.com/python-virtual-environments-a-primer$',  # Rejects automated requests with 403
    '^https[:]//doi\.org/10\.1007/JHEP07\(2023\)228$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//github\.com/(?:user-attachments/assets|[^/]+/[^/]+/assets)/',  # Asset links redirect to expiring signed downloads
]
extensions = ["bib", "ipynb", "json", "md", "py", "toml", "yaml", "yml"]
hidden = true  # Include the workflows under .github/
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "2d"
max_redirects = 0
max_retries = 3
remap = [
    '^https[:]//packaging\.python\.org/en/latest/tutorials/installing-packages/#installing-setuptools-extras$ https://packaging.python.org/en/latest/tutorials/installing-packages/#installing-extras',
    '^(https[:]//(?:docs\.astral\.sh|prek\.j178\.dev)/[^?#]*[^/?#])([?#].*)?$ $1/$2',
    '^https[:]//github\.dev/(.+)$ https://vscode.dev/github/$1',
    '^git\+(https://[^@]+)(@.*)?$ $1',
    "^(.+)/n$ $1",
    '^(https[:]//github\.com/ComPWA/compwa\.github\.io/compare)/\$PREVIOUS_TAG.*$ $1',
    '^https[:]//pypi\.org/p/\$$ https://pypi.org/project/compwa-github-io/',
