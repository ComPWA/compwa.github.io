retry_wait_time = 5
timeout = 30

[tool.poe.executor]
isolated = true
no-group = "dev"
type = "uv"

[tool.poe.groups.doc]
heading = "Documentation"

[tool.poe.groups.doc.tasks.doc]
cmd = """
sphinx-build \
    --builder=html \
    --fail-on-warning \
    --keep-going \
    --show-traceback \
    docs/ \
    docs/_build/html/
"""
executor = { group = "doc" }
help = "Build documentation and API"

[tool.poe.groups.doc.tasks.doc.env]
PYTHONWARNINGS = ""
TF_CPP_MIN_LOG_LEVEL = "3"
ZFIT_DISABLE_TF_WARNINGS = "1"

[tool.poe.groups.doc.tasks.doclive]
cmd = """
sphinx-autobuild \
    --builder=html \
    --open-browser \
    --port=0 \
    --re-ignore=/__pycache__(/.*)?$ \
    --re-ignore=/_build(/.*)?$ \
    --re-ignore=/\\.cache(/.*)?$ \
    --re-ignore=/\\.egg-info(/.*)?$ \
    --re-ignore=/\\.ipynb_checkpoints(/.*)?$ \
    --re-ignore=/\\.virtual_documents(/.*)?$ \
    --re-ignore=/api(/.*)?$ \
    --re-ignore=/docs$ \
    --re-ignore=/version\\.py$ \
    --re-ignore=\\.egg-info(/.*)?$ \
    --re-ignore=\\.pkl$ \
    --re-ignore=\\.png$ \
    --re-ignore=\\.svg$ \
    --re-ignore=\\.yml$ \
    docs/ \
    docs/_build/html/
"""
executor = { group = "doc", with = "sphinx-autobuild" }
help = "Set up a server to directly preview changes to the HTML pages"

[tool.poe.groups.doc.tasks.docnb]
env = { EXECUTE_NB = "yes" }
help = "Build documentation and API with cached notebook execution"
sequence = ["doc"]

[tool.poe.groups.doc.tasks.docnb-force]
env = { FORCE_EXECUTE_NB = "yes" }
help = "Build documentation and API with notebook execution (no cache)"
sequence = ["doc"]

[tool.poe.groups.doc.tasks.docnblive]
env = { EXECUTE_NB = "yes" }
help = "Set up a server to directly preview changes to the HTML pages with cached notebook execution"
sequence = ["doclive"]

[tool.poe.groups.doc.tasks.linkcheck]
cmd = "uvx --from lychee-bin lychee . --quiet"
executor = { type = "simple" }
help = "Check links and fragments in repository sources (requires internet connection)"

[tool.poe.groups.notebook]
heading = "Notebooks"

[tool.poe.groups.notebook.tasks.lab]
args = [{ name = "paths", default = "", positional = true }]
cmd = "jupyter lab ${paths}"
executor = { group = "jupyter" }
help = "Launch Jupyter Lab"

[tool.poe.groups.notebook.tasks.nb]
args = [{ name = "paths", default = "docs", multiple = true, positional = true }]
cmd = "pytest --nbmake --nbmake-timeout=0 ${paths}"
executor = { group = "notebooks", with = "nbmake" }
help = "Run all notebooks"

[tool.poe.tasks.all]
help = "Run all continuous integration (CI) tasks locally"
ignore_fail = "return_non_zero"
sequence = [
    "style",
    "linkcheck",
    "docnb-force",
]

[tool.poe.tasks.style]
cmd = "prek run --all-files"
executor = { group = "style" }
help = "Perform all linting, formatting, and spelling checks"

[tool.poe.tasks.upgrade]
executor = { type = "simple" }
help = "Upgrade lock files"
parallel = [
    "_upgrade-precommit",
    "_upgrade-uv",
]

[tool.poe.tasks._upgrade-precommit]
cmd = "prek autoupdate"
executor = { type = "simple" }

[tool.poe.tasks._upgrade-uv]
cmd = "uv lock --upgrade"
executor = { type = "simple" }

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--doctest-continue-on-failure",
    "--doctest-modules",
    "--durations=0",
    "--ignore-glob=*/.ipynb_checkpoints/*",
    "--ignore=docs/adr/001/operators.ipynb",
    "--ignore=docs/adr/001/parameter_container.py",
    "--ignore=docs/adr/001/sympy.ipynb",
    "--ignore=docs/conf.py",
    "--nbmake",
    "--nbmake-timeout=0",
]
filterwarnings = [
    "error",
    "ignore:Passing a schema to Validator.iter_errors is deprecated.*:DeprecationWarning",
    "ignore:open_text is deprecated.*:DeprecationWarning",
    "ignore:read_text is deprecated.*:DeprecationWarning",
    "ignore:unclosed .*:ResourceWarning",
]
norecursedirs = [
    ".ipynb_checkpoints",
    ".virtual_documents",
    "_build",
]
testpaths = [
    ".pre-commit",
    "docs",
]

[tool.ruff]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "ARG00",
    "DOC",
    "FBT",
    "PTH",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "private-member-access",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-self]
ignore-names = [
    "_latex",
    "_print",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",
    "C90",
    "D",
    "PLR09",
    "T20",
    "TC00",
    "ambiguous-unicode-character-string",
    "ambiguous-variable-name",
    "assert",
    "builtin-attribute-shadowing",
    "dunder-function-name",
    "function-call-in-default-argument",
    "global-statement",
    "global-variable-not-assigned",
    "import-outside-top-level",
    "invalid-argument-name",
    "invalid-function-name",
    "late-future-import",
    "magic-value-comparison",
    "missing-f-string-syntax",
    "mixed-case-variable-in-class-scope",
    "mixed-case-variable-in-global-scope",
    "module-import-not-at-top-of-file",
    "non-ascii-name",
    "non-lowercase-variable-in-function",
    "non-self-return-type",
    "redefined-loop-name",
    "suspicious-eval-usage",
    "too-many-blank-lines",
    "unnecessary-collection-call",
    "useless-expression",
    "useless-semicolon",
]
"**/001/operators.ipynb" = ["lambda-assignment"]
"**/003.ipynb" = ["function-uses-loop-variable", "import-private-name"]
"**/009.ipynb" = ["repeated-append"]
"**/010.ipynb" = ["repeated-append"]
"**/011.ipynb" = ["import-private-name", "no-self-use"]
"**/014.ipynb" = ["import-private-name"]
"**/016.ipynb" = ["import-private-name"]
"**/021.ipynb" = ["unsorted-imports"]
"**/022.ipynb" = ["import-private-name"]
"**/024.ipynb" = [
    "lambda-assignment",
    "ambiguous-variable-name",
    "suspicious-eval-usage"
]
"**/025.ipynb" = ["lambda-assignment"]
"**/98*.ipynb" = ["lambda-assignment", "no-self-use"]
"docs/*" = [
    "D",
    "assert",
    "implicit-namespace-package",
    "module-import-not-at-top-of-file",
    "print",
    "request-without-timeout",
]
"docs/conf.py" = [
    "builtin-variable-shadowing",
    "import-private-name",
    "redefined-loop-name",
    "undocumented-public-module",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
include-package-data = false

[tool.setuptools_scm]
version_file = "version.py"

[tool.tombi.files]
exclude = ["**/uv.lock"]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.3/compwa-policy.schema.json"
include = ["pyproject.toml"]

[[tool.ty.overrides]]
include = ["docs/symbolics.ipynb"]
rules.unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = [
    "docs/adr/001/operators.ipynb",
    "docs/adr/001/sympy.ipynb",
    "docs/adr/002/composition.ipynb",
    "docs/adr/002/expr.ipynb",
    "docs/adr/002/function.ipynb",
]
rules.import-not-found = "ignore"

[[tool.ty.overrides]]
include = ["docs/adr/**/*.ipynb"]
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.no-matching-overload = "ignore"
rules.unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["docs/adr/002/composition.ipynb"]
rules.call-non-callable = "ignore"
rules.empty-body = "ignore"

[tool.ty.rules]
division-by-zero = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
error-on-warning = true
