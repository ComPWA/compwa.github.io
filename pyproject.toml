[project]
name = "compwa-github-io"
description = "Source code for the ComPWA Organization pages"
requires-python = "~=3.14.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Common Partial Wave Analysis", email = "compwa-admin@ep1.rub.de" }]
maintainers = [{ email = "compwa-admin@ep1.rub.de" }]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Documentation = "https://compwa.github.io"
Issues = "https://github.com/ComPWA/compwa.github.io/issues"
Source = "https://github.com/ComPWA/compwa.github.io"

[dependency-groups]
dev = [
    "ruff",
    { include-group = "doc" },
    { include-group = "jupyter" },
    { include-group = "style" },
    { include-group = "test" },
]
doc = [
    "myst-nb",
    "sphinx",
    "sphinx-api-relink",
    "sphinx-book-theme",
    "sphinx-codeautolink[ipython]",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-hep-pdgref",
    "sphinx-pybtex-etal-style",
    "sphinx-remove-toctrees",
    "sphinx-reredirects",
    "sphinx-thebe",
    "sphinx-togglebutton",
    "sphinxcontrib-bibtex>=2.0",
    { include-group = "notebooks" },
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-myst",
    "jupyterlab-quickopen",
    "python-lsp-ruff",
    "python-lsp-server",
    { include-group = "notebooks" },
]
notebooks = [
    "black",
    "graphviz",
    "ipython",
    "numpy",
    "sympy",
]
style = [
    "attrs",
    "nbformat",
    "ty",
    { include-group = "types" },
]
test = ["jupyter"]
types = [
    "attrs",
    "sphinx-api-relink",
    { include-group = "notebooks" },
]

[build-system]
requires = [
    "setuptools>=61.2",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[tool.compwa.policy]
doc-apt-packages = "graphviz"
repo-name = "compwa.github.io"
repo-title = "ComPWA Organization"

[tool.compwa.policy.github]
github-pages = true
no-pypi = true

[tool.compwa.policy.python]
type-checker = ["ty"]

[tool.lychee]
cache = true
# In `exclude` and `remap`, `[:]` stops lychee from extracting the patterns as links from this file
exclude = [
    '\$(?:NEXT_[A-Z_]+|PREVIOUS_TAG)',  # Release Drafter substitutes these placeholders at runtime
    '^http[:]//127\.0\.0\.1:8000/?$',  # Local documentation server
    '^https[:]//doi\.org/10\.1007/JHEP07\(2023\)228$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//doi\.org/10\.5281/zenodo\.\d+$',  # Zenodo concept DOIs redirect to the latest version by design
    '^https[:]//github\.com/ComPWA/ampform/issues/new/choose$',  # Requires authentication
    '^https[:]//github\.com/ComPWA/compwa\.github\.io/assets/29308176/a1a19f74-b2dd-484f-804f-02da523ed4b7$',  # Redirects to an expiring signed download
    '^https[:]//github\.com/ComPWA/compwa\.github\.io/edit/main/docs/develop\.md$',  # Requires authentication
    '^https[:]//github\.com/organizations/ComPWA/settings/repository-defaults$',  # Requires organization admin access
    '^https[:]//github\.com/orgs/ComPWA/projects/5$',  # Private project
    '^https[:]//leetcode\.com/problemset$',  # Rejects automated requests with 403
    '^https[:]//stackoverflow\.com/a/(?:36344627|7844038)$',  # Answer links redirect to pages that reject automated requests with 403
    '^https[:]//www\.mathworks\.com/products/matlab\.html$',  # Rejects automated requests with 403
    '^https[:]//www\.npmjs\.com/package/cspell(?:#.*)?$',  # Rejects automated requests with 403
    "%7B[^/]*%7D",  # URL templates are completed at build or runtime
]
extensions = ["bib", "ipynb", "json", "md", "py", "toml", "yaml", "yml"]
hidden = true  # Include the workflows under .github/
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "2d"
max_redirects = 0
max_retries = 3
remap = [
    '^(https[:]//(?:docs\.astral\.sh|prek\.j178\.dev)/[^?#]*[^/?#])([?#].*)?$ $1/$2',
    '^(https[:]//github\.com/ComPWA/compwa\.github\.io/compare)/\$PREVIOUS_TAG.*$ $1',
    '^git\+(https[:]//[^@]+)(@.*)?$ $1',
    '^https[:]//adr\.github\.io/madr$ https://adr.github.io/madr/',
    '^https[:]//algs4\.cs\.princeton\.edu/$ https://algs4.cs.princeton.edu/home/',
    '^https[:]//ampform\.readthedocs\.io/$ https://ampform.readthedocs.io/stable/',
    '^https[:]//ampform\.readthedocs\.io/stable$ https://ampform.readthedocs.io/stable/',
    '^https[:]//ampform\.rtfd\.io/$ https://ampform.readthedocs.io/stable/',
    '^https[:]//anaconda\.org/conda-forge/ampform/badges/version\.svg$ https://anaconda.org/conda-forge/ampform',
    '^https[:]//anaconda\.org/conda-forge/qrules/badges/version\.svg$ https://anaconda.org/conda-forge/qrules',
    '^https[:]//anaconda\.org/conda-forge/tensorwaves/badges/version\.svg$ https://anaconda.org/conda-forge/tensorwaves',
    '^https[:]//black\.readthedocs\.io/$ https://black.readthedocs.io/en/stable/',
    '^https[:]//compwa\.github\.io/legacy$ https://compwa.github.io/legacy/',
    '^https[:]//compwa\.github\.io/policy$ https://compwa.github.io/policy/',
    '^https[:]//compwa\.github\.io/report/019$ https://compwa.github.io/report/019/',
    '^https[:]//compwa\.github\.io/report$ https://compwa.github.io/report/',
    '^https[:]//docs\.jax\.dev/en/latest$ https://docs.jax.dev/en/latest/',
    '^https[:]//docs\.python\.org/3$ https://docs.python.org/3/',
    '^https[:]//docs\.scipy\.org/doc/scipy-1\.7\.0$ https://docs.scipy.org/doc/scipy-1.7.0/',
    '^https[:]//docs\.sympy\.org/latest$ https://docs.sympy.org/latest/',
    '^https[:]//executablebooks\.org/$ https://executablebooks.org/en/latest/',
    '^https[:]//expertsystem\.readthedocs\.io/stable$ https://expertsystem.readthedocs.io/stable/',
    '^https[:]//github\.com/ComPWA/ampform/blob/main/\.github$ https://github.com/ComPWA/ampform/tree/main/.github',
    '^https[:]//github\.dev/(.+)$ https://vscode.dev/github/$1',
    '^https[:]//graphviz\.readthedocs\.io/en/stable$ https://graphviz.readthedocs.io/en/stable/',
    '^https[:]//hynek\.me/articles/python-subclassing-redux$ https://hynek.me/articles/python-subclassing-redux/',
    '^https[:]//isort\.readthedocs\.io/$ https://isort.readthedocs.io/en/latest/',
    '^https[:]//julialang\.org/downloads$ https://julialang.org/downloads/',
    '^https[:]//jupyterlab\.readthedocs\.io/en/stable$ https://jupyterlab.readthedocs.io/en/stable/',
    '^https[:]//myst-nb\.readthedocs\.io/$ https://myst-nb.readthedocs.io/en/latest/',
    '^https[:]//myst-parser\.readthedocs\.io/$ https://myst-parser.readthedocs.io/en/latest/',
    '^https[:]//pip\.pypa\.io/en/stable/cli/pip_install$ https://pip.pypa.io/en/stable/cli/pip_install/',
    '^https[:]//pixi\.prefix\.dev/v0\.63\.2/workspace/lockfile$ https://pixi.prefix.dev/v0.63.2/workspace/lockfile/',
    '^https[:]//pkgdocs\.julialang\.org/v1/environments$ https://pkgdocs.julialang.org/v1/environments/',
    '^https[:]//pkgdocs\.julialang\.org/v1/managing-packages$ https://pkgdocs.julialang.org/v1/managing-packages/',
    '^https[:]//pwa\.readthedocs\.io/software$ https://pwa.readthedocs.io/software/',
    '^https[:]//pwa\.rtfd\.io/$ https://pwa.readthedocs.io/',
    '^https[:]//qrules\.readthedocs\.io/$ https://qrules.readthedocs.io/stable/',
    '^https[:]//qrules\.readthedocs\.io/stable$ https://qrules.readthedocs.io/stable/',
    '^https[:]//qrules\.rtfd\.io/$ https://qrules.readthedocs.io/stable/',
    '^https[:]//realpython\.com/python-virtual-environments-a-primer$ https://realpython.com/python-virtual-environments-a-primer/',
    '^https[:]//scikit-hep\.org/developer$ https://scikit-hep.org/developer/',
    '^https[:]//swcarpentry\.github\.io/git-novice$ https://swcarpentry.github.io/git-novice/',
    '^https[:]//tensorwaves\.readthedocs\.io/$ https://tensorwaves.readthedocs.io/stable/',
    '^https[:]//tensorwaves\.readthedocs\.io/stable$ https://tensorwaves.readthedocs.io/stable/',
    '^https[:]//tensorwaves\.rtfd\.io/$ https://tensorwaves.readthedocs.io/stable/',
    '^https[:]//testdriven\.io/guides/complete-python$ https://testdriven.io/guides/complete-python/',
    '^https[:]//www\.andiamo\.co\.uk/resources/iso-language-codes$ https://www.andiamo.co.uk/resources/iso-language-codes/',
    '^https[:]//www\.infoq\.com/articles/sustainable-architectural-design-decisions$ https://www.infoq.com/articles/sustainable-architectural-design-decisions/',
    '^https[:]//www\.jetbrains\.com/pycharm$ https://www.jetbrains.com/pycharm/',
    '^https[:]//www\.maplesoft\.com/products/Maple$ https://www.maplesoft.com/products/Maple/',
    '^https[:]//www\.sphinx-doc\.org/$ https://www.sphinx-doc.org/en/master/',
    '^https[:]//www\.wolfram\.com/mathematica$ https://www.wolfram.com/mathematica/',
    '^https[:]//zenodo\.org/schemas/deposits/records/legacyrecord\.json$ https://raw.githubusercontent.com/zenodo/zenodo/master/zenodo/modules/deposit/jsonschemas/deposits/records/legacyrecord.json',
]
retry_wait_time = 5
timeout = 30

[tool.poe.executor]
isolated = true
no-group = "dev"
type = "uv"

[tool.poe.groups.doc]
heading = "Documentation"

[tool.poe.groups.doc.tasks.doc]
cmd = """
sphinx-build \
    --builder=html \
    --fail-on-warning \
    --keep-going \
    --show-traceback \
    docs/ \
    docs/_build/html/
"""
executor = { group = "doc" }
help = "Build documentation and API"

[tool.poe.groups.doc.tasks.doc.env]
PYTHONWARNINGS = ""
TF_CPP_MIN_LOG_LEVEL = "3"
ZFIT_DISABLE_TF_WARNINGS = "1"

[tool.poe.groups.doc.tasks.doclive]
cmd = """
sphinx-autobuild \
    --builder=html \
    --open-browser \
    --port=0 \
    --re-ignore=/__pycache__(/.*)?$ \
    --re-ignore=/_build(/.*)?$ \
    --re-ignore=/\\.cache(/.*)?$ \
    --re-ignore=/\\.egg-info(/.*)?$ \
    --re-ignore=/\\.ipynb_checkpoints(/.*)?$ \
    --re-ignore=/\\.virtual_documents(/.*)?$ \
    --re-ignore=/api(/.*)?$ \
    --re-ignore=/docs$ \
    --re-ignore=/version\\.py$ \
    --re-ignore=\\.egg-info(/.*)?$ \
    --re-ignore=\\.pkl$ \
    --re-ignore=\\.png$ \
    --re-ignore=\\.svg$ \
    --re-ignore=\\.yml$ \
    docs/ \
    docs/_build/html/
"""
executor = { group = "doc", with = "sphinx-autobuild" }
help = "Set up a server to directly preview changes to the HTML pages"

[tool.poe.groups.doc.tasks.docnb]
env = { EXECUTE_NB = "yes" }
help = "Build documentation and API with cached notebook execution"
sequence = ["doc"]

[tool.poe.groups.doc.tasks.docnb-force]
env = { FORCE_EXECUTE_NB = "yes" }
help = "Build documentation and API with notebook execution (no cache)"
sequence = ["doc"]

[tool.poe.groups.doc.tasks.docnblive]
env = { EXECUTE_NB = "yes" }
help = "Set up a server to directly preview changes to the HTML pages with cached notebook execution"
sequence = ["doclive"]

[tool.poe.groups.doc.tasks.linkcheck]
cmd = "uvx --from lychee-bin lychee . --quiet"
executor = { type = "simple" }
help = "Check links and fragments in repository sources (requires internet connection)"

[tool.poe.groups.notebook]
heading = "Notebooks"

[tool.poe.groups.notebook.tasks.lab]
args = [{ name = "paths", default = "", positional = true }]
cmd = "jupyter lab ${paths}"
executor = { group = "jupyter" }
help = "Launch Jupyter Lab"

[tool.poe.groups.notebook.tasks.nb]
args = [{ name = "paths", default = "docs", multiple = true, positional = true }]
cmd = "pytest --nbmake --nbmake-timeout=0 ${paths}"
executor = { group = "notebooks", with = "nbmake" }
help = "Run all notebooks"

[tool.poe.tasks.all]
help = "Run all continuous integration (CI) tasks locally"
ignore_fail = "return_non_zero"
sequence = [
    "style",
    "linkcheck",
    "docnb-force",
]

[tool.poe.tasks.style]
cmd = "prek run --all-files"
executor = { group = "style" }
help = "Perform all linting, formatting, and spelling checks"

[tool.poe.tasks.upgrade]
executor = { type = "simple" }
help = "Upgrade lock files"
parallel = [
    "_upgrade-precommit",
    "_upgrade-uv",
]

[tool.poe.tasks._upgrade-precommit]
cmd = "prek autoupdate"
executor = { type = "simple" }

[tool.poe.tasks._upgrade-uv]
cmd = "uv lock --upgrade"
executor = { type = "simple" }

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--doctest-continue-on-failure",
    "--doctest-modules",
    "--durations=0",
    "--ignore-glob=*/.ipynb_checkpoints/*",
    "--ignore=docs/adr/001/operators.ipynb",
    "--ignore=docs/adr/001/parameter_container.py",
    "--ignore=docs/adr/001/sympy.ipynb",
    "--ignore=docs/conf.py",
    "--nbmake",
    "--nbmake-timeout=0",
]
filterwarnings = [
    "error",
    "ignore:Passing a schema to Validator.iter_errors is deprecated.*:DeprecationWarning",
    "ignore:open_text is deprecated.*:DeprecationWarning",
    "ignore:read_text is deprecated.*:DeprecationWarning",
    "ignore:unclosed .*:ResourceWarning",
]
norecursedirs = [
    ".ipynb_checkpoints",
    ".virtual_documents",
    "_build",
]
testpaths = [
    ".pre-commit",
    "docs",
]

[tool.ruff]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "ARG00",
    "DOC",
    "FBT",
    "PTH",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "private-member-access",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-self]
ignore-names = [
    "_latex",
    "_print",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",
    "C90",
    "D",
    "PLR09",
    "T20",
    "TC00",
    "ambiguous-unicode-character-string",
    "ambiguous-variable-name",
    "assert",
    "builtin-attribute-shadowing",
    "dunder-function-name",
    "function-call-in-default-argument",
    "global-statement",
    "global-variable-not-assigned",
    "import-outside-top-level",
    "invalid-argument-name",
    "invalid-function-name",
    "late-future-import",
    "magic-value-comparison",
    "missing-f-string-syntax",
    "mixed-case-variable-in-class-scope",
    "mixed-case-variable-in-global-scope",
    "module-import-not-at-top-of-file",
    "non-ascii-name",
    "non-lowercase-variable-in-function",
    "non-self-return-type",
    "redefined-loop-name",
    "suspicious-eval-usage",
    "too-many-blank-lines",
    "unnecessary-collection-call",
    "useless-expression",
    "useless-semicolon",
]
"**/001/operators.ipynb" = ["lambda-assignment"]
"**/003.ipynb" = ["function-uses-loop-variable", "import-private-name"]
"**/009.ipynb" = ["repeated-append"]
"**/010.ipynb" = ["repeated-append"]
"**/011.ipynb" = ["import-private-name", "no-self-use"]
"**/014.ipynb" = ["import-private-name"]
"**/016.ipynb" = ["import-private-name"]
"**/021.ipynb" = ["unsorted-imports"]
"**/022.ipynb" = ["import-private-name"]
"**/024.ipynb" = [
    "lambda-assignment",
    "ambiguous-variable-name",
    "suspicious-eval-usage"
]
"**/025.ipynb" = ["lambda-assignment"]
"**/98*.ipynb" = ["lambda-assignment", "no-self-use"]
"docs/*" = [
    "D",
    "assert",
    "implicit-namespace-package",
    "module-import-not-at-top-of-file",
    "print",
    "request-without-timeout",
]
"docs/conf.py" = [
    "builtin-variable-shadowing",
    "import-private-name",
    "redefined-loop-name",
    "undocumented-public-module",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
include-package-data = false

[tool.setuptools_scm]
version_file = "version.py"

[tool.tombi.files]
exclude = ["**/uv.lock"]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.3/compwa-policy.schema.json"
include = ["pyproject.toml"]

[[tool.ty.overrides]]
include = ["docs/symbolics.ipynb"]
rules.unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = [
    "docs/adr/001/operators.ipynb",
    "docs/adr/001/sympy.ipynb",
    "docs/adr/002/composition.ipynb",
    "docs/adr/002/expr.ipynb",
    "docs/adr/002/function.ipynb",
]
rules.import-not-found = "ignore"

[[tool.ty.overrides]]
include = ["docs/adr/**/*.ipynb"]
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.no-matching-overload = "ignore"
rules.unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["docs/adr/002/composition.ipynb"]
rules.call-non-callable = "ignore"
rules.empty-body = "ignore"

[tool.ty.rules]
division-by-zero = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
error-on-warning = true
